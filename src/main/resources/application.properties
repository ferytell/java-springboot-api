spring.application.name=springboot-api

# Datasource: Default to H2, override with env vars for PostgreSQL
# For PostgreSQL, set these environment variables:
#   DB_URL=jdbc:postgresql://host:port/dbname
#   DB_USERNAME=your_user
#   DB_PASSWORD=your_password
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

jwt.secret=${SECRET_KEY}
jwt.expiration=604800000

# H2 console (disable for production)
spring.h2.console.enabled=true

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# Connection pooling
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.pool-name=FlashcardHikariPool

# Server
server.port=${SERVER_PORT:8077}
server.address=0.0.0.0

# Logging
logging.level.org.springframework.web=DEBUG
spring.mvc.log-request-details=true

