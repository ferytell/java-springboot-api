name: Deploy Java API to Ubuntu Server

on:
  push:
    branches: ["master", "main"]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          package-manager: "maven"

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Debug whoami
        run: whoami

      - name: Create deployment directory
        run: |
          mkdir -p /home/ferytell/java-springboot-api/deploy

      - name: Create .env file
        run: |
          echo "DB_URL=${{ secrets.DB_URL }}" >> .env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env

      - name: Deploy JAR
        run: |
          sudo -n /usr/bin/systemctl stop java-api || true
          cp target/*.jar /home/ferytell/java-springboot-api/deploy/app.jar
          sudo -n /usr/bin/systemctl start java-api || true

      - name: Restart service
        run: |
          sudo -n /usr/bin/systemctl daemon-reload
          sudo -n /usr/bin/systemctl restart java-api
          sudo -n /usr/bin/systemctl status java-api --no-pager -l

      - name: Clean up old builds
        run: |
          cd /home/ferytell/java-springboot-api/deploy
          # Keep only the current app.jar and last 3 backups
          ls -t app.jar.* 2>/dev/null | tail -n +4 | xargs -r rm
          if [ -f app.jar ]; then
            cp app.jar "app.jar.$(date +%Y%m%d_%H%M%S)"
          fi
